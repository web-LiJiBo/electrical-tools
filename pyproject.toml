[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standard-knowledge-service-v2-outline"
version = "0.1.0"
description = "新型电力系统机器可读标准知识服务工具代码大纲"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# 本地 Qwen-7B-Chat 文本分解运行依赖；基础代码大纲本身不强制加载大模型。
llm = [
    "torch>=2.0",
    # Qwen-7B-Chat随附模型代码的config.json声明4.32.0，且其流式生成扩展依赖该接口。
    "transformers==4.32.0",
    "tiktoken>=0.5",
    "einops>=0.6",
    "transformers-stream-generator==0.0.4",
    "accelerate>=0.21",
    "peft>=0.5",
]
graph = ["py2neo>=2021.2.4"]
ml = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.2",
]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=8.0"]
excel = ["openpyxl>=3.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: verified dataset integrity and audit baseline tests",
    "model: tests that load or run local model weights",
    "integration: multi-component or external-service integration tests",
]
