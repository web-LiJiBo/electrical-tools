<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模拟设备手工录入</title>
  <link rel="stylesheet" href="device-import.css">
  <script src="device-config.js" defer></script>
</head>
<body>
  <header><div class="wrap masthead">
    <nav aria-label="项目导航"><a id="home" href="index.html">返回问题分析</a><a id="quick" href="device-import.html">风机快捷录入</a></nav>
    <h1>模拟设备手工录入</h1><p>手填设备和动作，校验后保存到本地。仅用于模拟，不连接真实设备。</p>
  </div></header>
  <main class="wrap workspace">
    <section class="panel">
      <div class="panel-head"><h2>设备与动作配置</h2></div>
      <form id="device-form">
        <div class="panel-body">
          <fieldset id="form-fields" disabled>
            <legend>设备档案</legend>
            <div class="fields">
              <label>业务场景 <select id="scene" required></select></label>
              <label>设备类型 <select id="kind" required></select></label>
              <label>设备编号 <input id="device-id" maxlength="48" placeholder="SIM-IEC-DISPATCH-02" required></label>
              <label>设备名称 <input id="device-name" maxlength="40" placeholder="模拟调度机组2" required></label>
            </div>
            <p class="muted">本页使用 IEC 61850 模拟配置，命令点与反馈点由系统分开分配，无需填写现场点位。</p>
            <fieldset>
              <legend>初始状态与许可</legend>
              <p class="muted">例如当前有功出力（数字和单位）、控制许可（是或否）。用于新建模拟会话，不是本次提问的目标值。</p>
              <div id="state-list"></div>
              <button type="button" id="add-state">添加状态字段</button>
            </fieldset>
            <fieldset>
              <legend>动作定义</legend>
              <p class="muted">选择动作、结果字段和允许范围，再填写该动作必须满足的全部条件。</p>
              <div id="action-list"></div>
              <button type="button" id="add-action">添加动作</button>
            </fieldset>
          </fieldset>
        </div>
        <div class="panel-foot"><button type="submit" class="primary" id="validate" disabled>校验并预览</button></div>
      </form>
    </section>
    <section class="panel review">
      <div class="panel-head"><h2>保存到本地</h2></div>
      <div class="panel-body">
        <p class="status" id="status" role="status">正在读取配置选项…</p>
        <ul id="details" class="preview"></ul>
      </div>
      <div class="panel-foot">
        <button class="primary" type="button" id="save" disabled>确认保存</button>
        <a id="open-home" href="index.html" hidden>去首页查看设备</a>
      </div>
    </section>
  </main>
</body>
</html>
