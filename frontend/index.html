<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电力标准知识服务</title>
<style>
:root{--green:#00856f;--green-dark:#006b5a;--green-soft:#e8f5f1;--ink:#17211e;--muted:#63706c;--line:#dbe4e1;--bg:#f3f6f5;--white:#fff;--amber:#a9560b;--amber-bg:#fff3e7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei",Arial,sans-serif}header{height:96px;background:var(--green-dark);color:#fff;display:flex;align-items:center}.head{width:min(1380px,calc(100% - 48px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:14px}.mark{width:42px;height:42px;background:#fff;color:var(--green);display:grid;place-items:center;border-radius:6px;font-size:23px;font-weight:800}.brand h1{font-size:25px;margin:0}.brand p{margin:6px 0 0;color:#d9f2ec}.safety{border:1px solid #8acabe;padding:7px 11px;border-radius:4px;color:#edfffb}main{width:min(1380px,calc(100% - 48px));margin:22px auto 40px}.workspace{display:grid;grid-template-columns:400px minmax(0,1fr);gap:18px}.panel{background:var(--white);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 8px #173d3420}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head h2{font-size:18px;margin:0}.form{padding:8px 20px 20px}label{display:block;color:#42504c;font-weight:600;margin:14px 0 7px}select,textarea,input{width:100%;border:1px solid #b9c8c3;background:#fff;color:var(--ink);border-radius:4px;padding:11px 12px;font:inherit;outline:none}select:focus,textarea:focus,input:focus{border-color:var(--green);box-shadow:0 0 0 3px #00856f18}textarea{height:108px;resize:vertical;line-height:1.6}.params{height:100px;font:13px Consolas,monospace}.primary{width:100%;height:44px;margin-top:18px;border:0;border-radius:4px;background:var(--green);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.primary:hover{background:var(--green-dark)}.primary:disabled{opacity:.55;cursor:wait}.hint{color:var(--muted);font-size:12px;line-height:1.6;margin:12px 0 0}.status{padding:5px 10px;border-radius:4px;background:#eef2f1;color:#52605c;font-weight:600}.status.ok{background:var(--green-soft);color:var(--green-dark)}.status.warn{background:var(--amber-bg);color:var(--amber)}.tabs{display:flex;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}.tabs button{white-space:nowrap;border:0;border-bottom:3px solid transparent;background:none;color:#596763;padding:14px 16px;font-weight:600;cursor:pointer}.tabs button.active{color:var(--green-dark);border-bottom-color:var(--green)}#output{padding:22px;min-height:510px}.answer-label{color:var(--green-dark);font-size:13px;font-weight:700;margin-bottom:9px}.answer{font-size:19px;line-height:1.8;margin:0;color:#15231f}.answer-box{background:var(--green-soft);border-left:4px solid var(--green);padding:20px;margin-bottom:18px}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:4px}.meta div{padding:14px;border-right:1px solid var(--line)}.meta div:last-child{border:0}.meta span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.meta strong{font-size:15px}.section{margin-top:18px}.section h3{font-size:15px;margin:0 0 10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#edf3f1;color:#33413d;padding:6px 9px;border-radius:3px}.rule{padding:13px 0;border-bottom:1px solid var(--line);line-height:1.65}.rule:last-child{border:0}.rule-id{color:var(--green-dark);font-size:12px;font-weight:700}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.notice{background:var(--amber-bg);color:#753c08;padding:12px;border-radius:4px;line-height:1.6}.kv{display:grid;grid-template-columns:140px 1fr;border-top:1px solid var(--line)}.kv dt,.kv dd{margin:0;padding:10px;border-bottom:1px solid var(--line)}.kv dt{color:var(--muted)}code{white-space:pre-wrap;word-break:break-word;font-family:Consolas,monospace}@media(max-width:900px){.workspace{grid-template-columns:1fr}.head{width:calc(100% - 28px)}main{width:calc(100% - 28px)}.safety{display:none}.meta{grid-template-columns:1fr}.meta div{border-right:0;border-bottom:1px solid var(--line)}}
.panel{min-width:0}.kv{grid-template-columns:140px minmax(0,1fr)}.kv dd{min-width:0;overflow-wrap:anywhere}.meta strong{overflow-wrap:anywhere}
</style></head><body>
<header><div class="head"><div class="brand"><div class="mark">电</div><div><h1>电力标准知识服务</h1><p>标准知识查询与候选指令安全校验</p></div></div><div class="safety">仅完成至指令生成</div></div></header>
<main><p><a href="template-editor.html" id="template-editor-link" style="color:var(--green-dark);font-weight:600">指令模板管理 →</a></p><div class="workspace"><section class="panel"><div class="panel-head"><h2>问题输入</h2></div><div class="form">
<label>业务场景</label><select id="scenario"><option value="">自动识别（推荐）</option><option value="offshore_wind">海上风电</option><option value="substation_maintenance">变电站设备运维</option><option value="grid_fault_isolation">电网故障隔离</option><option value="renewable_grid_integration">新能源并网</option><option value="power_grid_operation">电网调度运行</option></select>
<label>请输入问题</label><textarea id="query" placeholder="请手动输入需要查询或验证的问题"></textarea>
<label style="display:flex;align-items:center;gap:8px"><input id="simulation-mode" type="checkbox" checked style="width:auto">使用模拟设备状态进行指令生成</label>
<p class="hint">状态判断经真实条款检索和来源原文参数比对。只有限值条款、没有动作依据时，不生成控制指令。标准编号、版本和适用上下文缺失会如实说明。</p>
<label>业务参数（可选）</label><textarea id="params" class="params">{}</textarea>
<input id="api" type="hidden" value="http://127.0.0.1:8000"><button id="run" class="primary">分析问题</button><p class="hint">仅完成建议和指令生成，不执行指令，不改变设备状态。</p>
<details open><summary style="margin-top:14px;cursor:pointer">当前模拟设备状态</summary><div id="device-state" class="hint">正在读取状态...</div></details>
</div></section><section class="panel"><div class="panel-head"><h2>分析结果</h2><span id="status" class="status">等待分析</span></div>
<div class="tabs"><button data-tab="summary" class="active">回答</button><button data-tab="decomposition">系统理解</button><button data-tab="scenario_model">适用场景</button><button data-tab="matching">依据条款</button><button data-tab="instruction">操作建议</button></div><div id="output"><div class="empty">输入问题后点击“分析问题”，答案将在这里显示。</div></div>
</section></div></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scenarioNames={offshore_wind:'海上风电',substation_maintenance:'变电站设备运维',grid_fault_isolation:'电网故障隔离',renewable_grid_integration:'新能源并网',power_grid_operation:'电网调度运行',general:'通用场景'};
// Isolated local preview may select 8001; arbitrary hosts or ports are not accepted.
if(new URLSearchParams(location.search).get('backend_port')==='8001')$('api').value='http://127.0.0.1:8001';
if(new URLSearchParams(location.search).get('backend_port')==='8001')$('template-editor-link').href='template-editor.html?backend_port=8001';
let result=null,tab='summary';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
const chips=items=>`<div class="chips">${(items||[]).map(x=>`<span class="chip">${esc(typeof x==='object'?(x.name||x.parameter||JSON.stringify(x)):x)}</span>`).join('')||'<span class="chip">无</span>'}</div>`;
function render(){if(!result)return;const d=result.data||{},answered=['answered','generated'].includes(result.status),hasPayload=Object.keys(d.candidate_instruction?.payload||{}).length>0,intent=hasPayload?(d.intent_classification?.intent==='instruction'?'指令生成':'条款咨询 → 建议指令'):d.advice?.instruction?'条款咨询 → 指令草案':d.advice?.error_code?'知识查询（模型建议未完成）':d.intent_classification?.intent==='instruction'?'指令生成请求':'知识查询',scene=scenarioNames[d.context?.scenario]||d.context?.scenario||'未识别';$('status').textContent={answered:'查询完成',generated:'指令已生成',partial:'模型建议未完成',uncertain:'证据不足',fail:'校验失败'}[result.status]||result.status;$('status').className='status '+(answered?'ok':'warn');
 if(d.device_assessment&&(tab==='summary'||tab==='instruction')){const a=d.device_assessment;$('output').innerHTML=`<div class="answer-box"><div class="answer-label">当前设备状态判断</div><p class="answer">${esc(d.answer.text)}</p></div><dl class="kv"><dt>本次设备</dt><dd>${esc(a.device_id||'未明确')}</dd><dt>当前状态</dt><dd><code>${esc(JSON.stringify(a.state))}</code></dd><dt>当前运行数据</dt><dd><code>${esc(JSON.stringify(a.runtime_facts))}</code></dd><dt>判断依据</dt><dd>${esc(a.rule)}</dd></dl><div class="notice">${esc(a.scope)}</div>`+groundedDetail(d);return}
 if(tab==='summary'){const answer=d.answer?.text||'当前知识库没有找到可直接回答该问题的可靠条款。';$('output').innerHTML=`<div class="answer-box"><div class="answer-label">直接回答</div><p class="answer">${esc(answer)}</p></div><div class="meta"><div><span>问题类型</span><strong>${intent}</strong></div><div><span>适用场景</span><strong>${esc(scene)}</strong></div><div><span>标准依据</span><strong>${esc(d.answer?.source_rule_id||'暂无')}</strong></div></div>${d.answer?.source_rule_id?`<div class="section"><h3>依据</h3><div class="rule"><div class="rule-id">${esc(d.answer.source_rule_id)}</div>${esc(d.answer.conclusion)}</div></div>`:''}${(result.warnings||[]).length?`<div class="section"><h3>业务提示</h3><div class="notice">${result.warnings.map(esc).join('<br>')}</div></div>`:''}`;return}
 if(tab==='decomposition'){$('output').innerHTML=`<div class="section"><h3>系统判断</h3><p>该问题属于 <strong>${intent}</strong>。${esc((d.intent_classification?.reasons||[]).join('；'))}</p></div><div class="section"><h3>识别设备</h3>${chips(d.decomposition?.entities)}</div><div class="section"><h3>识别动作</h3>${chips(d.decomposition?.actions)}</div><div class="section"><h3>条件与参数</h3>${chips(d.decomposition?.constraints)}</div>${(d.diagnostics||[]).length?`<div class="section"><h3>运行诊断</h3><div class="notice">${d.diagnostics.map(esc).join('<br>')}</div></div>`:''}`;return}
 if(tab==='scenario_model'){const m=d.scenario_model;$('output').innerHTML=m?`<div class="answer-box"><div class="answer-label">适用业务场景</div><p class="answer">${esc(scenarioNames[m.name]||m.name)}</p></div><div class="section"><h3>适用设备</h3>${chips(m.device_types)}</div><div class="section"><h3>标准主题</h3>${chips(m.standard_topics)}</div><div class="section"><h3>安全要求</h3>${(m.risk_controls||[]).map(x=>`<div class="rule">${esc(x)}</div>`).join('')}</div>`:'<div class="empty">未识别到具体业务场景。</div>';return}
 if(tab==='matching'){const selected=d.selected_rule,rules=(d.matching?.rules||[]).slice(0,5),g=d.knowledge_graph_evidence;$('output').innerHTML=`<div class="section"><h3>本次采用条款</h3>${selected?`<div class="answer-box"><div class="rule-id">${esc(selected.rule_id)}</div><p class="answer">${esc(selected.content)}</p></div>`:'<div class="notice">没有找到可采用的标准条款。</div>'}</div>${g?.path?`<div class="section"><h3>本地图谱溯源</h3><div class="rule">标准：${esc(g.standard_id)} · 条款：${esc(g.chapter_path||'原库未标注')}<br>来源：${esc(g.source_path)}<br><code>${esc(g.path.join(' → '))}</code></div><p class="hint">关联路径只用于来源导航，不构成控制授权。</p></div>`:''}<div class="section"><h3>其他相关条款</h3>${rules.map(r=>`<div class="rule"><div class="rule-id">${esc(r.rule_id)} · 相关度 ${Number(r.score||0).toFixed(3)}</div>${esc(r.content)}</div>`).join('')||'<div class="empty">无其他条款</div>'}</div>`;return}
 const c=d.candidate_instruction;$('output').innerHTML=c?`<div class="answer-box"><div class="answer-label">候选操作建议</div><p class="answer">${esc(c.explanation||'候选解释；是否生成请查看实际指令参数')}</p></div><dl class="kv"><dt>通信协议</dt><dd>${esc(c.protocol)}</dd><dt>目标设备</dt><dd>${esc(c.target||'未提供')}</dd><dt>指令参数</dt><dd><code>${esc(JSON.stringify(c.payload||{},null,2))}</code></dd><dt>缺少信息</dt><dd>${esc((c.missing_fields||[]).join('、')||'无')}</dd><dt>流程范围</dt><dd>仅生成指令</dd></dl>`:`<div class="notice">本次未生成指令。${esc(d.processing?.instruction_reason||d.advice?.conversion?.reason||d.advice?.notice||'请查看条款依据、模型建议及生成条件；知识查询标签不代表禁止生成建议指令。')}</div>`;
}
$('run').onclick=async()=>{const btn=$('run');btn.disabled=true;btn.textContent='正在分析...';$('status').textContent='处理中';try{let parameters;try{parameters=JSON.parse($('params').value||'{}');if(!parameters||Array.isArray(parameters)||typeof parameters!=='object')throw Error()}catch{throw Error('业务参数必须是合法 JSON 对象')}parameters.simulation_mode=$('simulation-mode').checked;const response=await fetch($('api').value+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('query').value,scenario_hint:$('scenario').value,parameters,target_protocol:'IEC61850'})});result=await response.json();if(!response.ok)throw Error(result.detail||'后端请求失败');tab='summary';document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab==='summary'));render();await loadDeviceState()}catch(e){$('output').innerHTML=`<div class="notice">请求失败：${esc(e.message)}</div>`;$('status').textContent='请求失败';$('status').className='status warn'}finally{btn.disabled=false;btn.textContent='分析问题';}};
async function loadDeviceState(){try{const response=await fetch($('api').value+'/simulation/state');if(!response.ok)throw Error();const s=await response.json();$('device-state').innerHTML=s.devices.map(d=>{const name=d.device_type==='pole_controller'?'模拟换流阀1':d.device_type==='transformer'?'模拟变压器'+Number(d.device_id.slice(-2)):d.device_type==='breaker'?'模拟断路器'+(d.protocol==='IEC61850'?1:2):'模拟逆变器'+(d.protocol==='IEC61850'?1:2);return `<div class="rule"><strong>${esc(name)}</strong> · ${esc(d.protocol)}<br><code>${esc(JSON.stringify(d.state))}<br>${esc(JSON.stringify(d.runtime_facts))}</code></div>`}).join('')}catch{$('device-state').textContent='无法读取模拟状态，请确认已启动最新版后端。'}}
loadDeviceState();
function groundedDetail(d){const e=d.real_clause_evidence,a=d.device_assessment;if(!e)return '<div class="notice">未取得可计算的适用来源条款；不会回退到预设阈值生成控制指令。</div>';return `<div class="section"><h3>真实来源与参数判定</h3>${(a.checks||[]).map(c=>`<div class="rule">${esc(c.parameter)}：实际 ${esc(c.actual)} ${esc(c.unit)} / 条款上限 ${esc(c.limit)} ${esc(c.unit)} · ${c.passed?'未越限':'越限'}</div>`).join('')}<dl class="kv"><dt>标准编号 / 版本</dt><dd>${esc(e.standard_id)} / ${esc(e.version||'未标注，待核验')}</dd><dt>来源条款ID</dt><dd>${esc(e.clause_id)}</dd><dt>来源文件与行</dt><dd>${esc(e.source_excel?.excel_file)} / ${esc(e.source_excel?.excel_sheet)} / 第${esc(e.source_excel?.excel_row)}行</dd><dt>条款原文</dt><dd>${esc(e.quote)}</dd><dt>控制缺失依据</dt><dd>${esc(d.control_block_reason)}</dd></dl></div>`;}
const renderBase=render;
function processingDetail(d){const p=d.processing;if(!p)return '';const labels={generated:'已生成',unavailable:'未完成',not_requested:'未请求',not_generated:'未生成',blocked:'校验阻止',not_proposed:'模型未提出指令'};return `<div class="section" id="processing-detail"><h3>本次处理进度</h3><dl class="kv"><dt>条款分析</dt><dd>${esc({answered:'已返回来源回答',generated:'完成生成前条款分析',uncertain:'来源或条件不足',fail:'校验失败'}[p.source_result_status]||p.source_result_status)}</dd><dt>查询分解来源</dt><dd>${esc(p.decomposition_source||'条款状态评估分支')}</dd><dt>模型建议</dt><dd>${esc(labels[p.advice_status]||p.advice_status)}${p.advice_reason_code?` · ${esc(p.advice_reason_code)}`:''}</dd><dt>指令转换</dt><dd>${esc(labels[p.instruction_status]||p.instruction_status)} · ${esc(p.instruction_reason)}</dd></dl></div>`;}
render=function(){renderBase();const d=result?.data;if(!d)return;if(['summary','instruction','decomposition'].includes(tab))$('output').insertAdjacentHTML('afterbegin',processingDetail(d));const a=d.advice;if(!a||!['summary','instruction'].includes(tab))return;const i=a.instruction;$('output').insertAdjacentHTML('beforeend',`<div class="section"><h3>条款梳理与操作建议</h3><p class="hint">${esc(a.error_code?'模型调用或输出校验失败':a.source==='llm'?'大模型生成，待人工复核':'建议模型未启用或本次未调用')} · ${esc(a.notice)}</p>${a.summary?`<p>${esc(a.summary)}</p>`:''}${(a.suggestions||[]).map(s=>`<div class="rule">${esc(s.text)}<div class="rule-id">引用：${esc(s.rule_ids.join('、'))}</div></div>`).join('')}${i?`<h3>自然语言指令草案</h3><p>${esc(i.text)}</p><p>结构化动作：${esc(i.device_id)} / ${esc(i.action)}</p><code>${esc(JSON.stringify(i.parameters))}</code><p>转换结果：${esc(a.conversion?.status||'未转换')} · ${esc(a.conversion?.reason||'仅文字草案，尚未生成协议字段')}</p>`:''}</div>`);};
</script></body></html>
