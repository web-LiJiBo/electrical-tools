<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电力标准知识服务</title>
<style>
:root{--green:#00856f;--green-dark:#006b5a;--green-soft:#e8f5f1;--ink:#17211e;--muted:#63706c;--line:#dbe4e1;--bg:#f3f6f5;--white:#fff;--amber:#a9560b;--amber-bg:#fff3e7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei",Arial,sans-serif}header{height:96px;background:var(--green-dark);color:#fff;display:flex;align-items:center}.head{width:min(1380px,calc(100% - 48px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:14px}.mark{width:42px;height:42px;background:#fff;color:var(--green);display:grid;place-items:center;border-radius:6px;font-size:23px;font-weight:800}.brand h1{font-size:25px;margin:0}.brand p{margin:6px 0 0;color:#d9f2ec}.safety{border:1px solid #8acabe;padding:7px 11px;border-radius:4px;color:#edfffb}main{width:min(1380px,calc(100% - 48px));margin:22px auto 40px}.workspace{display:grid;grid-template-columns:400px minmax(0,1fr);gap:18px}.panel{background:var(--white);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 8px #173d3420}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head h2{font-size:18px;margin:0}.form{padding:8px 20px 20px}label{display:block;color:#42504c;font-weight:600;margin:14px 0 7px}select,textarea,input{width:100%;border:1px solid #b9c8c3;background:#fff;color:var(--ink);border-radius:4px;padding:11px 12px;font:inherit;outline:none}select:focus,textarea:focus,input:focus{border-color:var(--green);box-shadow:0 0 0 3px #00856f18}textarea{height:108px;resize:vertical;line-height:1.6}.params{height:100px;font:13px Consolas,monospace}.primary{width:100%;height:44px;margin-top:18px;border:0;border-radius:4px;background:var(--green);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.primary:hover{background:var(--green-dark)}.primary:disabled{opacity:.55;cursor:wait}.hint{color:var(--muted);font-size:12px;line-height:1.6;margin:12px 0 0}.status{padding:5px 10px;border-radius:4px;background:#eef2f1;color:#52605c;font-weight:600}.status.ok{background:var(--green-soft);color:var(--green-dark)}.status.warn{background:var(--amber-bg);color:var(--amber)}.tabs{display:flex;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}.tabs button{white-space:nowrap;border:0;border-bottom:3px solid transparent;background:none;color:#596763;padding:14px 16px;font-weight:600;cursor:pointer}.tabs button.active{color:var(--green-dark);border-bottom-color:var(--green)}#output{padding:22px;min-height:510px}.answer-label{color:var(--green-dark);font-size:13px;font-weight:700;margin-bottom:9px}.answer{font-size:19px;line-height:1.8;margin:0;color:#15231f}.answer-box{background:var(--green-soft);border-left:4px solid var(--green);padding:20px;margin-bottom:18px}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:4px}.meta div{padding:14px;border-right:1px solid var(--line)}.meta div:last-child{border:0}.meta span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.meta strong{font-size:15px}.section{margin-top:18px}.section h3{font-size:15px;margin:0 0 10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#edf3f1;color:#33413d;padding:6px 9px;border-radius:3px}.rule{padding:13px 0;border-bottom:1px solid var(--line);line-height:1.65}.rule:last-child{border:0}.rule-id{color:var(--green-dark);font-size:12px;font-weight:700}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.notice{background:var(--amber-bg);color:#753c08;padding:12px;border-radius:4px;line-height:1.6}.kv{display:grid;grid-template-columns:140px 1fr;border-top:1px solid var(--line)}.kv dt,.kv dd{margin:0;padding:10px;border-bottom:1px solid var(--line)}.kv dt{color:var(--muted)}code{white-space:pre-wrap;word-break:break-word;font-family:Consolas,monospace}@media(max-width:900px){.workspace{grid-template-columns:1fr}.head{width:calc(100% - 28px)}main{width:calc(100% - 28px)}.safety{display:none}.meta{grid-template-columns:1fr}.meta div{border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body>
<header><div class="head"><div class="brand"><div class="mark">电</div><div><h1>电力标准知识服务</h1><p>标准知识查询与候选指令安全校验</p></div></div><div class="safety">演示环境 · 禁止自动下发</div></div></header>
<main><div class="workspace"><section class="panel"><div class="panel-head"><h2>问题输入</h2></div><div class="form">
<label>业务场景</label><select id="scenario"><option value="">自动识别（推荐）</option><option value="offshore_wind">海上风电</option><option value="substation_maintenance">变电站设备运维</option><option value="grid_fault_isolation">电网故障隔离</option><option value="renewable_grid_integration">新能源并网</option><option value="power_grid_operation">电网调度运行</option></select>
<label>请输入问题</label><textarea id="query">主变压器顶层油温允许是多少？</textarea>
<label>业务参数（可选）</label><textarea id="params" class="params">{"device_id":"T-01","device_type":"主变压器","operating_state":"运行"}</textarea>
<input id="api" type="hidden" value="http://127.0.0.1:8000"><button id="run" class="primary">分析问题</button><p class="hint">系统自动判断知识查询或控制请求。控制类结果仅作为候选建议，必须人工确认。</p>
</div></section><section class="panel"><div class="panel-head"><h2>分析结果</h2><span id="status" class="status">等待分析</span></div>
<div class="tabs"><button data-tab="summary" class="active">回答</button><button data-tab="decomposition">系统理解</button><button data-tab="scenario_model">适用场景</button><button data-tab="matching">依据条款</button><button data-tab="instruction">操作建议</button></div><div id="output"><div class="empty">输入问题后点击“分析问题”，答案将在这里显示。</div></div>
</section></div></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const examples={offshore_wind:['请生成换流变压器有载分接开关投跳闸候选指令',{"device_id":"TAP-01","device_type":"电力变压器","operating_state":"运行","device_config":{"protocol":"IEC61850","logical_node":"PTRC1","data_object":"Tr.general"}}],substation_maintenance:['主变压器顶层油温允许是多少',{"device_id":"T-01","device_type":"主变压器","operating_state":"运行"}],grid_fault_isolation:['换流变压器保护条件满足时请生成跳闸候选指令',{"device_id":"T-02","device_type":"电力变压器","fault_type":"保护动作","fault_location":"换流变压器分接开关","operating_state":"正常运行","device_config":{"protocol":"IEC61850","logical_node":"PTRC1","data_object":"Tr.general"}}],renewable_grid_integration:['光伏电站并网需要满足哪些电压和频率条件',{"plant_id":"PV-01","generation_type":"光伏","connection_voltage":110,"operating_state":"待并网","device_type":"光伏电站"}],power_grid_operation:['电网频率偏差时应采取什么调节措施',{"control_area":"华东区域","operating_state":"正常","dispatch_target":"发电机组","device_type":"发电机组"}]};
const scenarioNames={offshore_wind:'海上风电',substation_maintenance:'变电站设备运维',grid_fault_isolation:'电网故障隔离',renewable_grid_integration:'新能源并网',power_grid_operation:'电网调度运行',general:'通用场景'};
$('scenario').onchange=e=>{const x=examples[e.target.value];if(x){$('query').value=x[0];$('params').value=JSON.stringify(x[1],null,2)}};
let result=null,tab='summary';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
const chips=items=>`<div class="chips">${(items||[]).map(x=>`<span class="chip">${esc(typeof x==='object'?(x.name||x.parameter||JSON.stringify(x)):x)}</span>`).join('')||'<span class="chip">无</span>'}</div>`;
function render(){if(!result)return;const d=result.data||{},answered=['answered','needs_human'].includes(result.status),intent=d.intent_classification?.intent==='instruction'?'控制指令':'知识查询',scene=scenarioNames[d.context?.scenario]||d.context?.scenario||'未识别';$('status').textContent={answered:'查询完成',needs_human:'待人工确认',uncertain:'证据不足',fail:'校验失败'}[result.status]||result.status;$('status').className='status '+(answered?'ok':'warn');
 if(tab==='summary'){const answer=d.answer?.text||'当前知识库没有找到可直接回答该问题的可靠条款。';$('output').innerHTML=`<div class="answer-box"><div class="answer-label">直接回答</div><p class="answer">${esc(answer)}</p></div><div class="meta"><div><span>问题类型</span><strong>${intent}</strong></div><div><span>适用场景</span><strong>${esc(scene)}</strong></div><div><span>标准依据</span><strong>${esc(d.answer?.source_rule_id||'暂无')}</strong></div></div>${d.answer?.source_rule_id?`<div class="section"><h3>依据</h3><div class="rule"><div class="rule-id">${esc(d.answer.source_rule_id)}</div>${esc(d.answer.conclusion)}</div></div>`:''}${(result.warnings||[]).length?`<div class="section"><h3>业务提示</h3><div class="notice">${result.warnings.map(esc).join('<br>')}</div></div>`:''}`;return}
 if(tab==='decomposition'){$('output').innerHTML=`<div class="section"><h3>系统判断</h3><p>该问题属于 <strong>${intent}</strong>。${esc((d.intent_classification?.reasons||[]).join('；'))}</p></div><div class="section"><h3>识别设备</h3>${chips(d.decomposition?.entities)}</div><div class="section"><h3>识别动作</h3>${chips(d.decomposition?.actions)}</div><div class="section"><h3>条件与参数</h3>${chips(d.decomposition?.constraints)}</div>${(d.diagnostics||[]).length?`<div class="section"><h3>运行诊断</h3><div class="notice">${d.diagnostics.map(esc).join('<br>')}</div></div>`:''}`;return}
 if(tab==='scenario_model'){const m=d.scenario_model;$('output').innerHTML=m?`<div class="answer-box"><div class="answer-label">适用业务场景</div><p class="answer">${esc(scenarioNames[m.name]||m.name)}</p></div><div class="section"><h3>适用设备</h3>${chips(m.device_types)}</div><div class="section"><h3>标准主题</h3>${chips(m.standard_topics)}</div><div class="section"><h3>安全要求</h3>${(m.risk_controls||[]).map(x=>`<div class="rule">${esc(x)}</div>`).join('')}</div>`:'<div class="empty">未识别到具体业务场景。</div>';return}
 if(tab==='matching'){const selected=d.selected_rule,rules=(d.matching?.rules||[]).slice(0,5);$('output').innerHTML=`<div class="section"><h3>本次采用条款</h3>${selected?`<div class="answer-box"><div class="rule-id">${esc(selected.rule_id)}</div><p class="answer">${esc(selected.content)}</p></div>`:'<div class="notice">没有找到可采用的标准条款。</div>'}</div><div class="section"><h3>其他相关条款</h3>${rules.map(r=>`<div class="rule"><div class="rule-id">${esc(r.rule_id)} · 相关度 ${Number(r.score||0).toFixed(3)}</div>${esc(r.content)}</div>`).join('')||'<div class="empty">无其他条款</div>'}</div>`;return}
 const c=d.candidate_instruction;$('output').innerHTML=c?`<div class="answer-box"><div class="answer-label">候选操作建议</div><p class="answer">${esc(c.explanation||'已生成候选操作')}</p></div><dl class="kv"><dt>通信协议</dt><dd>${esc(c.protocol)}</dd><dt>目标设备</dt><dd>${esc(c.target||'未提供')}</dd><dt>指令参数</dt><dd><code>${esc(JSON.stringify(c.payload||{},null,2))}</code></dd><dt>缺少信息</dt><dd>${esc((c.missing_fields||[]).join('、')||'无')}</dd><dt>允许自动下发</dt><dd>否，必须人工确认</dd></dl>`:'<div class="empty">这是知识查询，不需要生成设备控制指令。</div>';
}
$('run').onclick=async()=>{const btn=$('run');btn.disabled=true;btn.textContent='正在分析...';$('status').textContent='处理中';try{let parameters;try{parameters=JSON.parse($('params').value||'{}')}catch{throw Error('业务参数不是合法 JSON')}const response=await fetch($('api').value+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('query').value,scenario_hint:$('scenario').value,parameters,target_protocol:'IEC61850'})});result=await response.json();if(!response.ok)throw Error(result.detail||'后端请求失败');tab='summary';document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab==='summary'));render()}catch(e){$('output').innerHTML=`<div class="notice">请求失败：${esc(e.message)}</div>`;$('status').textContent='请求失败';$('status').className='status warn'}finally{btn.disabled=false;btn.textContent='分析问题'}};
</script></body></html>
