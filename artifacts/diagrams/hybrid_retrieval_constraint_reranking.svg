<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">混合召回、RRF 融合与约束感知重排序</title>
  <desc id="desc">标准条款查询经过稠密、稀疏和知识图谱三路召回，进入 RRF 融合候选池；随后解析查询字段并依据业务场景、参数范围和安全约束重排序，输出带证据和可解释评分的 Top-K 结果。</desc>
  <defs>
    <style>
      .title{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:30px;font-weight:700;fill:#172B4D}
      .subtitle{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:16px;fill:#5E6C84}
      .stage{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;fill:#52616B}
      .box-title{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:18px;font-weight:700;fill:#172B4D}
      .box-text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:15px;fill:#344563}
      .small{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:13px;fill:#5E6C84}
      .formula{font-family:Consolas,'Microsoft YaHei',monospace;font-size:14px;fill:#344563}
      .arrow{fill:none;stroke:#829AB1;stroke-width:2.5;marker-end:url(#arrow)}
      .arrow-teal{fill:none;stroke:#168A88;stroke-width:2.5;marker-end:url(#arrow-teal)}
      .arrow-violet{fill:none;stroke:#7C5CC4;stroke-width:2.5;marker-end:url(#arrow-violet)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#829AB1"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#168A88"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#7C5CC4"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="800" y="65" text-anchor="middle" class="title">混合召回、RRF 融合与约束感知重排序</text>
  <text x="800" y="96" text-anchor="middle" class="subtitle">面向机器可读标准知识服务的可解释检索链路</text>

  <g>
    <rect x="72" y="138" width="270" height="38" rx="6" fill="#EAF2F8"/>
    <rect x="390" y="138" width="330" height="38" rx="6" fill="#EEF8F7"/>
    <rect x="770" y="138" width="330" height="38" rx="6" fill="#FFF5E8"/>
    <rect x="1150" y="138" width="330" height="38" rx="6" fill="#F2EEFB"/>
    <text x="207" y="163" text-anchor="middle" class="stage">01 查询理解</text>
    <text x="555" y="163" text-anchor="middle" class="stage">02 并行混合召回</text>
    <text x="935" y="163" text-anchor="middle" class="stage">03 融合与约束重排序</text>
    <text x="1315" y="163" text-anchor="middle" class="stage">04 结果交付</text>
  </g>

  <g>
    <rect x="92" y="305" width="230" height="142" rx="8" fill="#F7FBFE" stroke="#3D7EA6" stroke-width="2"/>
    <text x="207" y="352" text-anchor="middle" class="box-title">标准查询</text>
    <text x="207" y="385" text-anchor="middle" class="box-text">自然语言问题</text>
    <text x="207" y="414" text-anchor="middle" class="small">场景提示、参数、上下文</text>
  </g>

  <g>
    <rect x="405" y="230" width="290" height="100" rx="8" fill="#F7FBFE" stroke="#3D7EA6" stroke-width="2"/>
    <text x="435" y="269" class="box-title">稠密召回</text>
    <text x="435" y="298" class="box-text">语义向量检索</text>
    <text x="665" y="298" text-anchor="end" class="small">BGE / SBERT</text>

    <rect x="405" y="365" width="290" height="100" rx="8" fill="#F7FBFE" stroke="#3D7EA6" stroke-width="2"/>
    <text x="435" y="404" class="box-title">稀疏召回</text>
    <text x="435" y="433" class="box-text">关键词与条款词匹配</text>
    <text x="665" y="433" text-anchor="end" class="small">BM25</text>

    <rect x="405" y="500" width="290" height="100" rx="8" fill="#FBF9FE" stroke="#7C5CC4" stroke-width="2"/>
    <text x="435" y="539" class="box-title">知识图谱召回</text>
    <text x="435" y="568" class="box-text">实体、关系与规则扩展</text>
    <text x="665" y="568" text-anchor="end" class="small">图谱路径</text>
  </g>

  <g>
    <rect x="785" y="250" width="300" height="120" rx="8" fill="#FFF9F1" stroke="#D9822B" stroke-width="2"/>
    <text x="935" y="292" text-anchor="middle" class="box-title">RRF 融合候选池</text>
    <text x="935" y="323" text-anchor="middle" class="formula">score = Σ 1 / (60 + rank)</text>
    <text x="935" y="349" text-anchor="middle" class="small">合并多路结果，保留候选来源</text>

    <rect x="785" y="466" width="300" height="146" rx="8" fill="#F2FAF5" stroke="#3F8F63" stroke-width="2"/>
    <text x="935" y="507" text-anchor="middle" class="box-title">约束感知重排序</text>
    <text x="935" y="538" text-anchor="middle" class="box-text">相关性 + 领域约束 + 置信度</text>
    <text x="935" y="567" text-anchor="middle" class="small">筛除不满足场景与安全条件的候选</text>
    <text x="935" y="592" text-anchor="middle" class="small">输出排序依据与告警信息</text>
  </g>

  <g>
    <rect x="1155" y="270" width="320" height="132" rx="8" fill="#FBF9FE" stroke="#7C5CC4" stroke-width="2"/>
    <text x="1315" y="313" text-anchor="middle" class="box-title">Top-K 标准条款</text>
    <text x="1315" y="344" text-anchor="middle" class="box-text">条款正文、匹配分值、来源</text>
    <text x="1315" y="373" text-anchor="middle" class="small">附带证据链与排序解释</text>

    <rect x="1155" y="486" width="320" height="124" rx="8" fill="#F4FAF2" stroke="#3F8F63" stroke-width="2"/>
    <text x="1315" y="527" text-anchor="middle" class="box-title">字段解析与约束依据</text>
    <text x="1315" y="557" text-anchor="middle" class="box-text">主体、动作、条件、约束</text>
    <text x="1315" y="584" text-anchor="middle" class="small">场景、参数范围、安全边界</text>
  </g>

  <path d="M322 336 H365 V280 H405" class="arrow"/>
  <path d="M322 376 H350 V415 H405" class="arrow"/>
  <path d="M322 416 H365 V550 H405" class="arrow-violet"/>

  <path d="M695 280 H785" class="arrow"/>
  <path d="M695 415 H745 V320 H785" class="arrow"/>
  <path d="M695 550 H745 V340 H785" class="arrow-violet"/>

  <path d="M935 370 V466" class="arrow-teal"/>
  <path d="M1085 540 H1120 V336 H1155" class="arrow-violet"/>
  <path d="M1155 548 H1105 V540 H1085" class="arrow-teal"/>
  <path d="M207 447 V665 H1315 V610" class="arrow-teal"/>
  <text x="605" y="655" class="small">结构化字段与场景约束</text>

  <g>
    <line x1="72" y1="720" x2="1480" y2="720" stroke="#D9E2EC" stroke-width="1"/>
    <rect x="105" y="756" width="18" height="18" rx="3" fill="#EAF2F8" stroke="#3D7EA6"/>
    <text x="134" y="771" class="small">检索与候选生成</text>
    <rect x="395" y="756" width="18" height="18" rx="3" fill="#FFF5E8" stroke="#D9822B"/>
    <text x="424" y="771" class="small">融合计算</text>
    <rect x="610" y="756" width="18" height="18" rx="3" fill="#F2FAF5" stroke="#3F8F63"/>
    <text x="639" y="771" class="small">约束校验与重排序</text>
    <rect x="925" y="756" width="18" height="18" rx="3" fill="#FBF9FE" stroke="#7C5CC4"/>
    <text x="954" y="771" class="small">知识图谱与可解释结果</text>
  </g>
  <text x="800" y="835" text-anchor="middle" class="subtitle">图 2  混合召回、RRF 融合、字段解析与约束感知重排序</text>
</svg>
